packages:
  base: !include include/base.yaml
  wifi: !include include/wifi_not.yaml

esphome:
  name: controller051
  friendly_name: Countertop Aquarium Controller
  on_boot:
    priority: -100
    then:
      - script.execute: set_fill_valve_on_off
      - if:
          condition:
            and:
              - switch.is_on: ato_enabled
          then:
            - logger.log: "Start up ato enabled"
          else:
            - logger.log: "Start up ato disabled"

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf

number:

  - platform: template
    name: Error delay (m)
    id: error_delay
    icon: mdi:numeric
    restore_value: true
    initial_value: 10
    optimistic: true
    min_value: 1
    step: 1
    max_value: 120

script:

  - id: fill_duration_guard
    then:
      - delay: !lambda "return id(error_delay).state * 1000 * 60;"
      - switch.turn_on: error_fill_duration_exceeded
      - switch.turn_off: relay_valve

  - id: set_fill_valve_on_off
    then:
      - logger.log: "set_fill_valve_on_off"
      - delay: 50ms
      - if:
          condition:
            and:
              - switch.is_off: error_fill_duration_exceeded
              - switch.is_on: ato_enabled
              - binary_sensor.is_off: reservoir_full
          then:
            - switch.turn_on: relay_valve
            - script.execute: fill_duration_guard
      - if:
          condition:
            or:
              - binary_sensor.is_on: reservoir_full
          then:
            - switch.turn_off: relay_valve
            - script.stop: fill_duration_guard

binary_sensor:

  - platform: gpio
    id: reservoir_full
    name: Full Sensor
    pin:
      number: GPIO27
      mode: INPUT_PULLUP
    filters:
      - delayed_on_off: 1000ms
    on_state:
      then:
        - script.execute: set_fill_valve_on_off

switch:

  - platform: gpio
    id: relay_valve
    pin: GPIO17
    restore_mode: ALWAYS_OFF

  # 674 ml per minute, 90s, 1012 ml, gikfun diaphram pump
  - platform: gpio
    id: relay_pump
    pin: GPIO16
    restore_mode: ALWAYS_OFF

  - platform: template
    id: relay_pump_pub
    name: Drain Pump
    icon: mdi:pump
    lambda: |-
      return id(relay_pump).state;
    turn_on_action:
      - switch.turn_on: relay_pump
    turn_off_action:
      - switch.turn_off: relay_pump

  - platform: template
    id: relay_valve_pub
    name: Fill Valve
    icon: mdi:water-pump
    lambda: |-
      return id(relay_valve).state;
    turn_on_action:
      - switch.turn_on: relay_valve
      - script.execute: fill_duration_guard
    turn_off_action:
      - switch.turn_off: relay_valve
      - script.stop: fill_duration_guard

  - platform: template
    name: Auto Top Off
    id: ato_enabled
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      then:
        - script.execute: set_fill_valve_on_off
    turn_off_action:
      then:
        - switch.turn_off: relay_valve
        - script.stop: fill_duration_guard

  - platform: template
    name: Error Fill Duration Exceeded
    id: error_fill_duration_exceeded
    icon: mdi:alert
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

light:
  - platform: monochromatic
    name: Light
    output: output_gpio_33
    restore_mode: ALWAYS_OFF

output:
  - platform: ledc
    id: output_gpio_33
    pin: GPIO33
    # 6
    #min_power: 0.001
    min_power: 0.002
    zero_means_zero: true

one_wire:
  - platform: gpio
    pin: GPIO26

sensor:
  - platform: dallas_temp
    address: 0x2D011921144A0228
    name: Temperature
