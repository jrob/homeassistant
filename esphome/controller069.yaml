packages:
  base: !include include/base.yaml
  wifi: !include include/wifi_not.yaml

esphome:
  name: controller069
  friendly_name: Cube Aquarium Power Strip

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf

switch:

  - platform: gpio
    name: Outlet 1
    pin: GPIO32
    restore_mode: ALWAYS_ON
  - platform: gpio
    name: Outlet 2
    pin: GPIO25
    restore_mode: ALWAYS_ON
  - platform: gpio
    name: Outlet 3
    pin: GPIO26
    restore_mode: ALWAYS_ON
  - platform: gpio
    name: Outlet 4
    pin: GPIO17
    restore_mode: ALWAYS_ON
  - platform: gpio
    name: Outlet 5
    pin: GPIO18
    restore_mode: ALWAYS_ON
  - platform: gpio
    name: Outlet 6
    pin: GPIO19
    restore_mode: ALWAYS_ON
  - platform: gpio
    name: Outlet 7
    pin: GPIO21
    restore_mode: ALWAYS_ON
  - platform: gpio
    name: Outlet 8
    pin: GPIO16
    restore_mode: ALWAYS_ON
