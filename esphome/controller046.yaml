packages:
  base: !include include/base.yaml
  wifi: !include include/wifi_not.yaml

esphome:
  name: controller046
  friendly_name: Garage Door

esp8266:
  board: d1_mini

status_led:
  pin: GPIO2

switch:

  - platform: gpio
    id: relay_1
    pin: D5
    name: Button

binary_sensor:

  - platform: gpio
    name: Open Sensor
    pin:
      number: D1
      mode: INPUT_PULLUP
    filters:
      - invert:
    on_press:
      then:
         - lambda: id(garage_door_cover).publish_state(COVER_OPEN);

  - platform: gpio
    name: Closed Sensor
    pin:
      number: D6
      mode: INPUT_PULLUP
    filters:
      - invert:
    on_press:
      then:
         - lambda: id(garage_door_cover).publish_state(COVER_CLOSED);

cover:
  - platform: template
    id: garage_door_cover
    name: Garage Door
    device_class: garage
    open_action:
      - switch.turn_on: relay_1
      - delay: 0.25s
      - switch.turn_off: relay_1
    close_action:
      - switch.turn_on: relay_1
      - delay: 0.25s
      - switch.turn_off: relay_1
    stop_action:
      - switch.turn_on: relay_1
      - delay: 0.25s
      - switch.turn_off: relay_1
