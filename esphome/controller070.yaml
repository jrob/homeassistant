packages:
  base: !include include/base.yaml
  wifi: !include include/wifi_not.yaml

esphome:
  name: controller070
  friendly_name: Cube Aquarium Controller
  on_boot:
    priority: -100
    then:
      - script.execute: set_fill_valve_on_off
      - if:
          condition:
            and:
              - switch.is_on: ato_enabled
          then:
            - logger.log: "Start up ato enabled"
          else:
            - logger.log: "Start up ato disabled"

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf

number:

  - platform: template
    name: Error Delay (m)
    id: error_delay
    icon: mdi:clock
    restore_value: true
    initial_value: 10
    optimistic: true
    min_value: 1
    step: 1
    max_value: 30

script:

  - id: fill_duration_guard
    then:
      - delay: !lambda "return id(error_delay).state * 1000 * 60;"
      - switch.turn_on: error_fill_duration_exceeded
      - switch.turn_off: relay_valve

  - id: set_fill_valve_on_off
    then:
      - logger.log: "set_fill_valve_on_off"
      - delay: 50ms
      - if:
          condition:
            and:
              - switch.is_off: error_fill_duration_exceeded
              - switch.is_on: ato_enabled
              - binary_sensor.is_off: sump_full
          then:
            - logger.log: "turn on relay_valve"
            - switch.turn_on: relay_valve
            - script.execute: fill_duration_guard
      - if:
          condition:
            or:
              - binary_sensor.is_on: sump_full
          then:
            - logger.log: "turn off relay_valve"
            - switch.turn_off: relay_valve
            - script.stop: fill_duration_guard

binary_sensor:

  - platform: gpio
    name: Pump Button
    pin:
      number: GPIO26
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      - switch.toggle: relay_pump_pub

  - platform: gpio
    name: Valve Button
    pin:
      number: GPIO27
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 50ms
    on_press:
          then:
            - switch.toggle: relay_valve

  - platform: gpio
    name: Sump Full Sensor
    id: sump_full
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 500ms
    on_state:
      then:
        - logger.log: "Sump Full On"
        - script.execute: set_fill_valve_on_off

  - platform: gpio
    name: Sump Low Sensor
    id: sump_low
    pin:
      number: GPIO19
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 500ms
    on_press:
      then:
        - switch.turn_off: relay_pump

  - platform: gpio
    name: Moisture Sensor
    pin:
      number: GPIO21
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 1s

switch:

  - platform: gpio
    id: relay_pump
    pin: GPIO2
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: relay_valve
    pin: GPIO4
    restore_mode: ALWAYS_OFF

  - platform: template
    id: relay_valve_pub
    name: Fill Valve
    icon: mdi:water-pump
    lambda: |-
      return id(relay_valve).state;
    turn_on_action:
      - switch.turn_on: relay_valve
      - script.execute: fill_duration_guard
    turn_off_action:
      - switch.turn_off: relay_valve
      - script.stop: fill_duration_guard

  - platform: template
    id: relay_pump_pub
    name: Drain Pump
    icon: mdi:pump
    lambda: |-
      return id(relay_pump).state;
    turn_on_action:
      - if:
          condition:
            - binary_sensor.is_off: sump_low
          then:
            - switch.turn_on: relay_pump
    turn_off_action:
      - switch.turn_off: relay_pump

  - platform: template
    name: Auto Top Off
    id: ato_enabled
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      then:
        - script.execute: set_fill_valve_on_off
    turn_off_action:
      then:
        - switch.turn_off: relay_valve
        - script.stop: fill_duration_guard

  - platform: template
    name: Error Fill Duration Exceeded
    id: error_fill_duration_exceeded
    icon: mdi:alert
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
