substitutions:
  name: switch042
  description: Kitchen Under Cabinet LED Strips

packages:
  base: !include include/base.yaml
  wifi: !include include/wifi_not.yaml

<<: !include include/common.yaml

esphome:
  name: $name
  comment: $description (Sonoff Mini)

esp8266:
  board: esp01_1m

binary_sensor:

  - platform: gpio
    pin: GPIO00
    id: reset
    internal: true
    filters:
      - invert:
      - delayed_off: 10ms
    on_press:
      - light.toggle:
          id: light_1

  - platform: gpio
    name: $description Switch
    pin: GPIO04
    filters:
      - invert:
    id: switch_1
    #on_press:
    #  then:
    #    - light.toggle:
    #        id: light_1
    #on_release:
    #  then:
    #    - light.toggle:
    #        id: light_1

output:

  - platform: gpio
    id: relay_1
    pin: GPIO12

light:

  - platform: binary
    id: light_1
    name: $description
    output: relay_1
    restore_mode: ALWAYS_ON

status_led:

  pin:
    number: GPIO13
    inverted: true
