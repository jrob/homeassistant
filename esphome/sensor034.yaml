esphome:
  name: sensor034

esp8266:
  board: esp01_1m

packages:
  base: !include include/base.yaml
  wifi: !include include/wifi_not.yaml

i2c:
  - id: bus_a
    sda: 4
    scl: 5

sensor:
  - platform: bme280_i2c
    temperature:
      name: "BME280 Temperature"
      oversampling: 1x
    pressure:
      name: "BME280 Pressure"
      oversampling: 1x
    humidity:
      name: "BME280 Humidity"
      oversampling: 1x
    address: 0x76
    update_interval: 60s
